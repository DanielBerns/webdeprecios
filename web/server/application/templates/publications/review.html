{% extends "base.html" %}

{% block content %}
<section class="w3-container w3-card-4 w3-light-grey w3-text-blue w3-margin">
<h2 class="w3-center"><b>Review your post</b></h2>
<article class="w3-container w3-card-4 w3-light-gray w3-text-blue w3-margin">
    <div class="w3-row w3-section">
        <div class="w3-rest">
        <ul class="w3-ul">
            <li>User: {{ user.identifier }}-{{ user.url_suffix }}</li>
            <li>Post: {{ post.identifier }}-{{ post.url_suffix }}</li>                        
            <li>Title: {{ post.title }}</li>                        
            <li>body: {{ post.body }}</li>                
            <li>active: {{ post.active }}</li>                    
            <li>photo: <img src="/pics/{{ post.photo_url() }}" alt="Photo" width="256"></li>            
        </ul>
        </div>
    </div>
</article>
<article class="w3-container w3-card-4 w3-light-grey w3-text-blue w3-margin">
        <div class="w3-row w3-section">
          <div class="w3-third w3-left">
             <a href="{{ url_for('main.index') }}">Index</a>
          </div>
          <div class="w3-third w3-right">
             <a href="/authentication.logout">Logout</a>
          </div>
        <div>
</article>
</section>
{% endblock %}
