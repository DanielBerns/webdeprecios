{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2><b>Acceso con usuario y contraseña</b></h2>
  
    <form id="form">
    <fieldset>
        <div>
            <div>
            <!--<i class="w3-xxlarge fa fa-envelope-o"></i>-->
            <label for="email">Correo electrónico</label>
            </div>
        </div>
        <div>
            <div>
            <input type="email" id="email" class="email" required/>
            </div>
        </div>
        <div>
            <div>
            <!--<i class="w3-xxlarge fa fa-key"></i>-->
            <label for="password">Contraseña</label>
            </div>
        </div>        
        <div>
            <div>
            <input type="password" id="password" class="password" required/>
            </div>
        </div>
        <div>
          <div>
             <p>
             <input class="button"  name="send" type="submit" value="Enviar">
             </p>
          </div>
        </div>
    </fieldset>
</form>
</div>
<div class="container">
        <div>
          <div>
             <a href="{{ url_for('authentication.register_user') }}">Crear cuenta de usuario</a>
          </div>
          <div>
             <a href="{{ url_for('authentication.forgot_password') }}">¿Olvidó la contraseña?</a>
          </div>
          <div>
             <a href="{{ url_for('authentication.goodbye') }}">Adiós</a>
          </div>
        </div>
</div>
{% endblock %}
